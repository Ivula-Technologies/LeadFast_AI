<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · LeadFast AI</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.3rem; margin: 16px 0 8px; }
  p { color: #475569; max-width: 320px; margin: 0 auto 20px; }
  button { font: inherit; font-weight: 600; background: #0369a1; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>LeadFast still answers your customers while you're out of signal. Your leads will be here when you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
