name: CI

# Checks every pull request before it is merged; the cPanel package is still
# built by build-cpanel-package.yml after merge.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: NextJs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: NextJs/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://leadfast.ivulatechnologies.com
        run: npm run build
